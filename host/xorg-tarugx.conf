# Dedicated Xorg server for the current fixed-mode TaruGX framebuffer.
# Do not install as the system-wide xorg.conf.
Section "ServerFlags"
    Option "AutoAddGPU" "false"
    Option "BlankTime" "0"
    Option "StandbyTime" "0"
    Option "SuspendTime" "0"
    Option "OffTime" "0"
EndSection

Section "Device"
    Identifier "TaruGX"
    Driver "modesetting"
    BusID "PCI:1:0:0"
    Option "kmsdev" "/dev/dri/by-path/pci-0000:01:00.0-card"
    Option "AccelMethod" "none"
    Option "ShadowFB" "true"
    Option "DoubleShadow" "true"
    Option "SWcursor" "true"
    Option "PageFlip" "false"
EndSection

Section "Monitor"
    Identifier "TaruGX-HDMI"
    Option "DPMS" "false"
EndSection

Section "Screen"
    Identifier "TaruGX-Screen"
    Device "TaruGX"
    Monitor "TaruGX-HDMI"
    DefaultDepth 24
    SubSection "Display"
        Depth 24
        Modes "640x480"
    EndSubSection
EndSection

Section "ServerLayout"
    Identifier "TaruGX-Desktop"
    Screen 0 "TaruGX-Screen"
EndSection
